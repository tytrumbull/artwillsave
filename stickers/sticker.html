<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Art Will Save sticker, 3 x 3 in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&display=swap">
<style>
  @page { size: 3in 3in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .sticker {
    width: 3in; height: 3in; box-sizing: border-box;
    background: #2F4FD0; border-radius: .32in;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Familjen Grotesk", Arial, sans-serif; color: #fff;
    padding: .16in;
  }
  .name { font-weight: 700; font-size: 21pt; letter-spacing: -.01em; line-height: 1; margin-bottom: .12in; }
  .qr-wrap { position: relative; width: 1.62in; height: 1.62in; }
  .qr-wrap::before { content: ""; position: absolute; inset: 0; transform: translate(.07in, .07in); background: #FF4FA3; border-radius: .14in; }
  .qr {
    position: relative; width: 100%; height: 100%; box-sizing: border-box;
    background: #fff; border-radius: .14in; padding: .11in;
  }
  .qr img { width: 100%; height: 100%; display: block; }
  .scan { margin-top: .16in; text-align: center; font-weight: 500; font-size: 8.4pt; line-height: 1.3; }
  .scan b { font-weight: 700; font-size: 10.5pt; display: block; }
</style>
</head>
<body>
  <div class="sticker">
    <div class="name">Art Will Save</div>
    <div class="qr-wrap"><div class="qr"><img src="qr.svg" alt="QR code to artwillsave.com/r"></div></div>
    <div class="scan"><b>Scan for a story</b>Escanea y lee un cuento<br>Scanne et lis une histoire</div>
  </div>
</body>
</html>
